<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
    <linearGradient id="hero-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2C40;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#0F2C40;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0F2C40;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#hero-gradient)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <text x="720" y="450" font-family="Manrope, Inter, system-ui" font-size="48" font-weight="500" fill="rgba(255,255,255,0.1)" text-anchor="middle" dominant-baseline="middle">Hero Image Placeholder</text>
  <text x="720" y="520" font-family="Manrope, Inter, system-ui" font-size="24" fill="rgba(255,255,255,0.08)" text-anchor="middle" dominant-baseline="middle">Fachada de vidro moderna - Brasília</text>
</svg>